version: '3'

info:
  companyName: 'dvgamerr'
  productName: 'livepaper'
  productIdentifier: 'io.dvgamerr.livepaper'
  description: 'Live wallpaper with system tray'
  copyright: '(c) 2025, dvgamerr'
  version: '1.0.0'

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - build
      - bin
    file:
      - .DS_Store
      - .gitignore
    watched_extension:
      - '*.go'
    git_ignore: true
  executes:
    - cmd: powershell -Command "New-Item -ItemType Directory -Force -Path bin | Out-Null"
      type: blocking
    - cmd: bun scripts/generate-icons.js
      type: blocking
    - cmd: go run github.com/akavel/rsrc@latest -ico public/icon.ico -o cmd/livepaper/rsrc_windows_amd64.syso
      type: blocking
    - cmd: go build -tags livepaper_dev -o bin/livepaper.exe ./cmd/livepaper/
      type: blocking
    - cmd: ./bin/livepaper.exe
      type: primary
